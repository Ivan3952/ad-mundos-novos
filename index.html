<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Ad mundos novos — галактика</title>
<style>
  :root { --fg:#e9e4ff; --dim:#9a93b8; --accent:#b9a6ff; --panel:rgba(14,10,28,.94); }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:#000; color:var(--fg); overflow:hidden;
    font-family: "Segoe UI", system-ui, -apple-system, Roboto, sans-serif; }
  canvas { position:fixed; inset:0; width:100%; height:100%; display:block; touch-action:none; cursor:grab; }
  canvas.drag { cursor:grabbing; }
  canvas.hover { cursor:pointer; }
  header { position:fixed; left:20px; top:16px; pointer-events:none; }
  header h1 { margin:0; font-size:20px; letter-spacing:.18em; text-transform:uppercase; font-weight:600; }
  header p { margin:4px 0 0; font-size:12px; color:var(--dim); letter-spacing:.08em; }
  .tools { position:fixed; right:16px; top:16px; display:flex; gap:8px; }
  .tools button { background:var(--panel); color:var(--fg); border:1px solid rgba(185,166,255,.25);
    border-radius:10px; width:40px; height:40px; font-size:18px; cursor:pointer; }
  .tools button:hover { border-color:var(--accent); }
  #card { position:fixed; right:20px; bottom:20px; width:380px; max-width:calc(100vw - 40px);
    max-height:calc(100vh - 100px); display:flex; flex-direction:column;
    background:var(--panel); border:1px solid rgba(185,166,255,.25); border-radius:16px; padding:18px 18px 16px;
    transform:translateY(20px); opacity:0; pointer-events:none;
    transition:opacity .25s, transform .25s; }
  #card.open { opacity:1; transform:none; pointer-events:auto; }
  #card h2 { margin:0 28px 2px 0; font-size:18px; }
  #card .author { color:var(--accent); font-size:13px; }
  #card .group { color:var(--dim); font-size:12px; margin-top:2px; }
  #card .group:empty { display:none; }
  #card .desc { margin:12px 0 0; font-size:14px; line-height:1.55; color:#cfc8ea; white-space:pre-line;
    overflow-y:auto; flex:1 1 auto; min-height:0; padding-right:6px; }
  #card .desc:empty { display:none; }
  #card .desc.rich { white-space:normal; }
  #card .desc.rich p { margin:0 0 .7em; }
  #card .desc.rich h4 { margin:1em 0 .4em; font-size:14px; color:var(--fg); text-decoration:none; }
  #card .desc.rich h4 u { text-decoration:none; }
  #card .desc.rich blockquote { margin:0 0 .8em; padding:.2em 0 .2em .8em; border-left:2px solid rgba(185,166,255,.35); color:#bdb5dc; }
  #card .desc.rich blockquote p { margin:0; }
  #card .desc.rich ul, #card .desc.rich ol { margin:0 0 .7em; padding-left:1.2em; }
  #card .desc.rich a { all:revert; color:var(--accent); }
  #card .desc.rich hr { border:0; border-top:1px solid rgba(185,166,255,.2); margin:1em 0; }
  #card .desc::-webkit-scrollbar { width:4px; } #card .desc::-webkit-scrollbar-thumb { background:rgba(185,166,255,.3); border-radius:2px; }
  #card .author a { color:inherit; text-decoration:none; flex:none; padding:0; border:0; background:none; border-radius:0; font-size:inherit; } #card .author a:hover { text-decoration:underline; }
  .gal { display:flex; gap:6px; overflow-x:auto; margin-top:12px; padding-bottom:4px; flex:none; }
  .gal img { height:64px; width:auto; border-radius:8px; cursor:zoom-in; opacity:.85; border:1px solid rgba(185,166,255,.2); flex:none; }
  .gal img:hover { opacity:1; border-color:var(--accent); }
  #lb { position:fixed; inset:0; background:rgba(2,1,8,.94); display:none; align-items:center; justify-content:center; z-index:10; }
  #lb.open { display:flex; }
  #lb img { max-width:94vw; max-height:88vh; border-radius:6px; box-shadow:0 0 60px rgba(185,166,255,.15); }
  #lb button { position:absolute; background:none; border:0; color:#e9e4ff; font-size:34px; cursor:pointer; padding:16px; }
  #lbx { top:6px; right:10px; } #lbp { left:6px; top:50%; transform:translateY(-50%); } #lbn { right:6px; top:50%; transform:translateY(-50%); }
  #lbc { position:absolute; bottom:14px; left:50%; transform:translateX(-50%); color:var(--dim); font-size:13px; }
  #card .row { display:flex; gap:8px; margin-top:14px; }
  #card a, #card button.nav { flex:1; text-align:center; text-decoration:none; color:var(--fg); font-size:13px;
    padding:9px 10px; border-radius:10px; border:1px solid rgba(185,166,255,.3); background:rgba(185,166,255,.08); cursor:pointer; }
  #card a:hover, #card button.nav:hover { border-color:var(--accent); }
  #card .close { position:absolute; right:10px; top:8px; background:none; border:0; color:var(--dim); font-size:22px; cursor:pointer; }
  #hint { position:fixed; left:50%; bottom:18px; transform:translateX(-50%); font-size:12px; color:var(--dim);
    pointer-events:none; transition:opacity 1s; }
  @media (max-width:600px) {
    #card { left:12px; right:12px; bottom:12px; width:auto; max-width:none; max-height:58vh; }
    header { left:14px; top:14px; max-width:calc(100vw - 170px); }
    header h1 { font-size:14px; letter-spacing:.12em; }
    header p { font-size:11px; }
    .tools { right:12px; top:12px; gap:6px; }
    .tools button { width:36px; height:36px; }
  }

  :root { --fg:#f8f3ec; --dim:#aaa9b9; --accent:#ded0be; --panel:#0d0e18; }
  header { left:32px; top:28px; }
  header h1 { font-family:Georgia,serif; font-size:clamp(25px,3.4vw,50px); font-weight:400; letter-spacing:-.045em; line-height:1; text-transform:none; }
  header p { margin-top:10px; color:#c7c4d3; font-size:12px; letter-spacing:.09em; }
  .tools { top:28px; right:28px; gap:0; border:1px solid #383749; border-radius:10px; background:#10111e; overflow:hidden; }
  .tools button { border:0; border-radius:0; width:42px; height:42px; }
  .tools button + button { border-left:1px solid #383749; }
  .tools button:hover { background:#282539; }
  .world-picker { position:fixed; bottom:26px; left:28px; display:grid; gap:7px; color:#cbc3d3; font-size:11px; }
  .world-picker select { width:min(250px,70vw); min-height:42px; padding:0 12px; color:var(--fg); background:#10111e; border:1px solid #3e394e; border-radius:8px; font:inherit; font-size:13px; }
  #hint { bottom:33px; color:#c7c4d3; white-space:nowrap; }
  #card { --world-accent:#d9c6ff; right:24px; bottom:24px; width:410px; padding:0 19px 17px; background:#0d0e18; border-color:color-mix(in srgb,var(--world-accent) 40%,#11121e); border-radius:14px; box-shadow:0 16px 50px #0008; overflow:hidden; }
  #card .cover { cursor:zoom-in; border:0; height:clamp(100px,24vh,230px); flex:none; margin:0 -19px 15px; background-color:#090914; background-position:center; background-size:100% 100%, contain; background-repeat:no-repeat; border-bottom:1px solid var(--world-accent); }
  #card h2 { font-family:Georgia,serif; font-weight:400; font-size:clamp(22px,2.2vw,32px); line-height:1.1; margin-right:0; }
  #card .author, #clocation { color:var(--world-accent); }
  #card .close { z-index:1; width:34px; height:34px; border-radius:50%; color:#fff; background:#0d0e18e8; }
  #card .desc { color:#e0dce5; line-height:1.68; scrollbar-color:var(--world-accent) transparent; }
  #card .desc.rich h4 { color:var(--world-accent); font:600 17px/1.25 Georgia,serif; }
  #card .desc.rich blockquote { border-color:var(--world-accent); }
  #card .gal img { opacity:.93; border-radius:5px; }
  #card .row a, #card .row button { background:#181825; border-color:#383749; }
  #card .row a:hover, #card .row button:hover { border-color:var(--world-accent); }
  :focus-visible { outline:2px solid #f0dbc9; outline-offset:-3px; }
  @media(max-width:760px) { #hint { display:none; } }
  @media(max-width:600px) {
    header { left:16px; top:19px; } header h1 { font-size:23px; }
    header p { margin-top:5px; letter-spacing:0; }
    .tools { right:12px; top:16px; } .tools button { width:35px; height:36px; }
    .world-picker { left:14px; bottom:14px; }
    body:has(#card.open) .world-picker { visibility:hidden; }
    #card { right:12px; bottom:12px; width:auto; padding-inline:14px; }
    #card .cover { height:clamp(62px,12vh,110px); margin-inline:-14px; }
    #card .gal img { height:45px; }
  }
  @media(prefers-reduced-motion:reduce) { #card, #hint { transition:none; } }

  #map-mode { margin-top:7px; color:var(--accent); font-size:11px; }
  #landmark-controls { position:fixed; inset:0; pointer-events:none; }
  .landmark { position:absolute; transform:translate(-50%,-50%); pointer-events:auto; color:#f8eee4; background:#151321; border:1px solid #736077; border-radius:20px; padding:6px 10px; white-space:nowrap; font:11px system-ui; cursor:pointer; }
  .landmark[hidden], #landmark-note[hidden] { display:none; }
  .landmark:hover { background:#38263b; }
  #landmark-note { position:fixed; top:100px; left:50%; transform:translateX(-50%); z-index:3; width:min(350px,calc(100vw - 24px)); padding:16px; background:#121321; color:var(--fg); border:1px solid #736077; border-radius:12px; box-shadow:0 12px 36px #0008; }
  #landmark-note h2 { margin:0 26px 6px 0; font:22px Georgia,serif; }
  #landmark-note p { margin:0; font:13px/1.5 system-ui; }
  #landmark-close { position:absolute; top:8px; right:9px; color:inherit; background:none; border:0; font-size:24px; cursor:pointer; }

  #tour-picker { font-size:13px; }
  #tour-picker summary { cursor:pointer; color:var(--fg); background:#10111e; border:1px solid #3e394e; border-radius:8px; padding:10px 12px; }
  #tour-list { display:grid; gap:4px; margin-top:5px; padding:5px; background:#10111e; border:1px solid #3e394e; border-radius:8px; }
  #tour-list button, #tour-stop button { cursor:pointer; border:1px solid #51465d; border-radius:6px; padding:8px; background:#1d192a; color:var(--fg); font:inherit; }
  #tour-list button { text-align:left; }
  #tour-list button:hover, #tour-stop button:hover { border-color:var(--accent); }
  #tour-stop { flex:none; padding:9px 10px; margin-top:8px; background:#171422; border-left:2px solid var(--world-accent); font-size:12px; line-height:1.35; }
  #tour-stop p { margin:5px 0 7px; }
  #tour-position { color:var(--world-accent); }
  #tour-stop .tour-actions { display:flex; gap:6px; }
  @media(max-height:650px) { #card:has(#tour-stop:not([hidden])) .cover { display:none; } }

  body.arriving > :is(header,.tools,.world-picker,#hint) { visibility:hidden; }
  #arrival { position:fixed; inset:0; display:grid; align-items:end; pointer-events:auto; }
  #arrival[hidden] { display:none; }
  #arrival button { justify-self:center; margin-bottom:max(26px,env(safe-area-inset-bottom)); pointer-events:auto; color:#f8f3ec; background:#10111edb; border:1px solid #65566c; border-radius:24px; padding:11px 19px; font:13px system-ui; cursor:pointer; }

    #eria-scene { position:fixed; inset:0; box-sizing:border-box; width:100%; height:100%; max-width:none; max-height:none; margin:0; padding:0; border:0; background:#000; color:#eeedf7; }
    #eria-scene[open] { display:grid; place-items:center; animation:eria-dark .5s ease-in both; }
    #eria-scene::backdrop { background:transparent; }
    #eria-scene figure { margin:0; text-align:center; }
    #eria-planet { width:min(70vw,50vh,520px); aspect-ratio:1; display:grid; place-items:center; margin:auto; border-radius:50%; box-shadow:0 0 1px #bbb7d3; }
    #eria-planet img { width:100%; height:100%; object-fit:contain; border-radius:50%; animation:eria-dark 1s .4s both; }
    #eria-scene figcaption { margin-top:1.6rem; font:italic clamp(18px,3vw,26px) Georgia,serif; animation:eria-dark .9s .9s both; }
    #eria-scene h2 { position:absolute; top:20px; left:5vw; font:normal clamp(15px,3vw,22px) Georgia,serif; }
    #eria-view { position:absolute; inset:0; overflow:hidden; touch-action:none; user-select:none; cursor:grab; }
    #eria-view:active { cursor:grabbing; }
    #eria-view figure { position:absolute; inset:50% auto auto 50%; width:min(70vw,50vh,520px); aspect-ratio:1; transform-origin:0 0; pointer-events:none; }
    #eria-view figcaption { position:absolute; width:100%; }
    #eria-actions { position:absolute; bottom:max(24px,env(safe-area-inset-bottom)); display:flex; justify-content:center; gap:6px; flex-wrap:wrap; }
    #eria-title { pointer-events:none; }
    #eria-actions button,#eria-enter { padding:.65em 1em; border:1px solid #555269; border-radius:8px; color:#efeaf8; background:#12121b; cursor:pointer; }
    @keyframes eria-dark { from { opacity:0 } to { opacity:1 } }
    @media(prefers-reduced-motion:reduce) { #eria-scene[open],#eria-planet img,#eria-scene figcaption { animation:none; } }
</style>
</head>
<body>
<canvas id="c"></canvas>
<header><h1 id="t"></h1><p id="st"></p><p id="map-mode"></p></header>
<div id="landmark-controls"></div>
<aside id="landmark-note" aria-labelledby="landmark-title" hidden>
  <button id="landmark-close" aria-label="Закрыть пояснение">×</button>
  <h2 id="landmark-title"></h2><p id="landmark-description"></p>
</aside>
<div class="tools">
  <button id="zin" title="Приблизить">+</button>
  <button id="zout" title="Отдалить">−</button>
  <button id="home" title="Вся галактика">◎</button>
</div>
<div class="world-picker">
  <details id="tour-picker"><summary>Экскурсии</summary><div id="tour-list"></div></details>
  <label for="world-picker">Планеты</label>
  <select id="world-picker"><option value="">Вся галактика</option></select>
</div>
<dialog id="eria-scene" aria-labelledby="eria-title">
  <div id="eria-view"><figure><div id="eria-planet"><img src="img/w235.jpg" alt="Колыбель под Вуалью Звёзд"></div><figcaption>Приятного сна, Эрия.</figcaption></figure></div>
  <h2 id="eria-title">По ту сторону · Вселенная Эрия</h2>
  <div id="eria-actions">
    <button id="eria-minus" type="button" aria-label="Отдалить Колыбель">−</button>
    <button id="eria-plus" type="button" aria-label="Приблизить Колыбель">+</button>
    <button id="eria-home" type="button">К планете</button>
    <button id="eria-back" type="button">Вернуться в атлас</button>
  </div>
</dialog>
<div id="card">
  <button class="cover" id="ccover" type="button" aria-label="Открыть иллюстрацию планеты"></button>
  <button class="close" id="cclose">×</button>
  <h2 id="cname"></h2>
  <div class="author" id="cauthor"></div>
  <div class="group" id="cgroup"></div>
  <div class="group" id="clocation"></div>
  <button id="eria-enter" type="button" hidden>Пройти через чёрную дыру</button>
  <section id="tour-stop" aria-label="Остановка экскурсии" hidden>
    <strong id="tour-position"></strong>
    <p id="tour-lore"></p>
    <div class="tour-actions">
      <button id="tour-next" type="button">Дальше</button>
      <button id="tour-exit" type="button">Выйти из экскурсии</button>
    </div>
  </section>
  <div class="desc" id="cdesc"></div>
  <div class="gal" id="cgal"></div>
  <div class="row">
    <button class="nav" id="prev" title="Предыдущая">←</button>
    <a id="clink" target="_blank" rel="noopener">Пост</a>
    <a id="cart" target="_blank" rel="noopener">Статья</a>
    <button class="nav" id="next" title="Следующая">→</button>
  </div>
</div>
<div id="lb"><img id="lbi" alt=""><button id="lbx">×</button><button id="lbp">‹</button><button id="lbn">›</button><div id="lbc"></div></div>
<div id="hint">Тяни, чтобы лететь · колесо или щипок — зум · нажми на планету</div>

<div id="arrival" hidden><button type="button" id="skip-arrival">Пропустить вступление</button></div>
<script src="planets.js"></script>
<script>
(() => {
  const G = window.GALAXY, P = G.planets;
  document.getElementById("t").textContent = G.title;
  document.getElementById("st").textContent = G.subtitle;

  const cv = document.getElementById("c"), ctx = cv.getContext("2d");
  let W = 0, H = 0, DPR = 1;
  const cam = { x: 0, y: 0, z: 0.5 };
  let target = null;           // куда летит камера
  let selected = -1, hovered = -1;
  let needsDraw = true, animated = false;
  const lastFrame = {};
  const MAXZ = 3;

  // --- загрузка картинок
  P.forEach(p => { p.im = new Image(); p.im.onload = () => { p.ready = true; needsDraw = true; }; p.im.src = p.img; });

  // --- оформление окрестностей: свечение в цветах планеты + частицы по мотивам из описания
  const hexRgb = h => { const n = parseInt(h.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; };
  const mulberry = a => () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  const FX_COUNT = { bubbles: 18, crystals: 14, embers: 26, snow: 26, spores: 22, petals: 16, sparkles: 22, tendrils: 9, rings: 3, debris: 14, glitch: 16, hearts: 12 };
  P.forEach((p, i) => {
    const R = mulberry(i * 9973 + 17);
    p.pal = (p.palette && p.palette.length ? p.palette : ["#b9a6ff"]).map(hexRgb);
    p.fx = [];
    (p.motifs || ["sparkles"]).forEach((m, mi) => {
      const n = Math.max(1, Math.round(FX_COUNT[m] * (mi ? 0.35 : 0.6)));
      for (let k = 0; k < n; k++) p.fx.push({ m, k, n, a: R() * 6.283, r: 0.44 + R() * 0.5, sp: 0.6 + R() * 0.8,
        ph: m === "rings" ? k / n : R(), s: 0.6 + R() * 0.8, c: p.pal[(k + mi) % p.pal.length], rot: R() * 6.283 });
    });
  });
  const rgba = (c, a) => `rgba(${c[0]},${c[1]},${c[2]},${a})`;

  function canvasLayer(size) {
    const canvas = document.createElement("canvas");
    canvas.width = canvas.height = size;
    return canvas.getContext("2d");
  }

  function glow(layer, x, y, radius, color) {
    const gradient = layer.createRadialGradient(x, y, 0, x, y, radius);
    gradient.addColorStop(0, color);
    gradient.addColorStop(1, "transparent");
    layer.fillStyle = gradient;
    layer.fillRect(x - radius, y - radius, radius * 2, radius * 2);
  }

  function makePlanetLayer(p) {
    const layer = canvasLayer(448);
    layer.translate(224, 224);
    layer.scale(168, 168);
    layer.globalCompositeOperation = "lighter";
    const colors = p.pal;
    for (const [i, color] of colors.entries()) {
      if (p.effect === "veil") break;
      glow(layer, Math.cos(i * 2.1) * 0.24, Math.sin(i * 2.1) * 0.18, 0.78, rgba(color, 0.22));
    }
    layer.scale(0.85, 0.85);
    const ink = (i, alpha) => rgba(colors[i % colors.length], alpha);
    const ellipse = (rx, ry, rotation, i, alpha, start = 0, end = 2 * Math.PI) => {
      layer.strokeStyle = ink(i, alpha);
      layer.beginPath();
      layer.ellipse(0, 0, rx, ry, rotation, start, end);
      layer.stroke();
    };
    layer.lineWidth = 0.009;
    const shape = p.effect;
    switch (shape) {
      case "frost":
        ellipse(0.61, 0.57, 0, 0, 0.5, 3.4, 6);
        break;
      case "seal":
        layer.setLineDash([0.08, 0.055]);
        ellipse(0.61, 0.61, 0, 0, 0.55);
        layer.setLineDash([]);
        ellipse(0.67, 0.67, 0, 1, 0.35);
        break;
      case "metronome":
        ellipse(0.81, 0.81, 0, 0, 0.48);
        ellipse(0.74, 0.74, 0, 1, 0.34);
        for (let i = 0; i < 60; i++) {
          const angle = i * Math.PI / 30;
          const x = Math.cos(angle), y = Math.sin(angle);
          const major = i % 5 === 0;
          const inner = major ? 0.75 : 0.79;
          layer.strokeStyle = ink(major ? 1 : 0, major ? 0.82 : 0.36);
          layer.beginPath();
          layer.moveTo(x * inner, y * inner);
          layer.lineTo(x * 0.84, y * 0.84);
          layer.stroke();
        }
        glow(layer, 0, -0.53, 0.22, ink(1, 0.52));
        glow(layer, 0, 0.53, 0.22, ink(1, 0.52));
        break;
      case "shield": {
        const rim = layer.createRadialGradient(0, 0, 0.39, 0, 0, 0.74);
        rim.addColorStop(0, "transparent");
        rim.addColorStop(0.70, ink(0, 0.22));
        rim.addColorStop(0.82, ink(1, 0.48));
        rim.addColorStop(1, "transparent");
        layer.fillStyle = rim;
        layer.fillRect(-0.75, -0.75, 1.5, 1.5);
        for (let i = 0; i < 6; i++) {
          const angle = i * Math.PI / 3;
          ellipse(0.68, 0.68, 0, 0, 0.62, angle + 0.06, angle + 0.91);
        }
        ellipse(0.72, 0.12, -0.41, 1, 0.47, 0.1, 3.04);
        glow(layer, -0.48, -0.48, 0.20, ink(1, 0.85));
        glow(layer, 0.66, -0.12, 0.13, ink(2, 0.76));
        break;
      }
      case "obsidian":
        ellipse(0.83, 0.22, -0.42, 1, 0.42, 0.13, 3.13);
        ellipse(0.97, 0.29, -0.42, 2, 0.47, 3.30, 5.85);
        glow(layer, -0.63, 0.24, 0.22, ink(1, 0.36));
        break;
      case "accretion":
        layer.lineWidth = 0.033;
        for (let i = 0; i < 5; i++) {

      case "ponds":

  function drawFx(p, sx, sy, S, t, fxA) {
    ctx.globalCompositeOperation = "lighter";

    for (const f of p.fx) {
      const u = (T * 0.08 * f.sp + f.ph) % 1;    // фаза цикла 0..1
      let x, y, al = 1, shape = f.m;
      switch (f.m) {
        case "bubbles": case "hearts":
          x = Math.cos(f.a) * f.r + Math.sin(T * 0.8 + f.ph * 9) * 0.03; y = 0.55 - u * 1.15; al = Math.sin(u * Math.PI); break;
        case "embers":
          x = Math.cos(f.a) * f.r + Math.sin(T * 1.6 + f.ph * 12) * 0.035; y = 0.35 + Math.sin(f.a) * 0.15 - u * 0.95;
          al = Math.sin(u * Math.PI) * (0.6 + 0.4 * Math.sin(T * 9 + f.ph * 20)); break;
        case "snow":
          x = Math.cos(f.a) * f.r + Math.sin(T * 0.6 + f.ph * 9) * 0.05; y = -0.6 + u * 1.2; al = Math.sin(u * Math.PI) * 0.85; break;
        case "spores": {

          x = Math.cos(b) * f.r + Math.sin(T * 0.3 + f.ph * 7) * 0.05; y = Math.sin(b) * f.r * 0.8 + Math.cos(T * 0.25 + f.ph * 5) * 0.05;
          al = 0.5 + 0.5 * Math.sin(T * 1.3 + f.ph * 11); break; }
        case "crystals": case "debris": {
          const b = f.a + T * 0.06 * f.sp * (f.k % 2 ? 1 : 0.8);
          x = Math.cos(b) * (f.r + 0.08); y = Math.sin(b) * (f.r + 0.08) * 0.42 + 0.04; break; }
        case "petals": {

          ctx.globalAlpha = 1; ctx.fillStyle = rgba([255, 255, 255], A * 0.6);
          ctx.beginPath(); ctx.arc(px - 3 * sz, py - 3 * sz, Math.max(0.6, 2 * sz), 0, 6.283); ctx.fill(); break;
        case "embers": case "spores": {

          ctx.fillStyle = rgba(f.c, A); ctx.beginPath(); ctx.arc(px, py, r, 0, 6.283); ctx.fill(); break; }
        case "snow": {
          const r = Math.max(1, 5 * sz);

          ctx.stroke(); break; }
        case "crystals": case "debris": {

        case "petals": {

        case "sparkles": {

          ctx.beginPath(); ctx.arc(px, py, Math.max(0.7, 1.4 * sz), 0, 6.283); ctx.fill(); break; }
        case "hearts": {

          const g = ctx.createLinearGradient(px, py, ex, ey); g.addColorStop(0, rgba(f.c, A * 0.6)); g.addColorStop(1, rgba(f.c, 0));

  // --- детерминированный генератор случайных чисел
  let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;

  // --- звёзды: 3 слоя параллакса, в экранных координатах с зацикливанием
  const TILE = 1024;
  const layers = [0.08, 0.23, 0.45].map((par, i) => ({
    par, stars: Array.from({ length: 180 - i * 40 }, () => ({
      x: rnd(), y: rnd(), r: (0.4 + rnd() * (0.6 + i * 0.5)), a: 0.3 + rnd() * 0.7,
      hue: rnd() < 0.15 ? 260 : rnd() < 0.1 ? 30 : 0
    }))
  }));
  for (const layer of layers) {
    const tile = canvasLayer(TILE);
    for (const star of layer.stars) {
      tile.fillStyle = star.hue ? `hsla(${star.hue},80%,80%,${star.a * 0.72})` : `rgba(255,255,255,${star.a * 0.72})`;
      for (const dx of [-TILE, 0, TILE]) for (const dy of [-TILE, 0, TILE]) {

        if (x < -star.r || x > TILE + star.r || y < -star.r || y > TILE + star.r) continue;
        tile.beginPath(); tile.arc(x, y, star.r, 0, 2 * Math.PI); tile.fill();
      }
    }
    layer.tile = tile.canvas;
  }

  // The wide shot and map share the same pre-rendered spiral.

  const armPoint = (arm, t, offset = 0) => {
    const angle = arm * 2 * Math.PI / arms + t * 3.65 + offset;

    return [Math.cos(angle) * radius, Math.sin(angle) * radius];

  const mapMode = document.getElementById("map-mode");

  const planetsById = new Map(P.map(p => [p.id, p]));

  }

  // Keep the point between the fingers anchored during simultaneous zoom and pan.

    const scale = Math.max(.006, Math.min(5, eriaCam.scale * factor));
    const ratio = scale / eriaCam.scale;
    eriaCam.x = toX + (eriaCam.x - fromX) * ratio;
    eriaCam.y = toY + (eriaCam.y - fromY) * ratio;
    eriaCam.scale = scale;
    paintEria();

  function gesture() {
    const [a,b=a] = eriaPointers.values();

    if (e.button !== 0 || eriaPointers.size >= 2) return;
    eriaView.setPointerCapture(e.pointerId);
    eriaPointers.set(e.pointerId,{x:e.clientX-W/2,y:e.clientY-H/2});
  };
  eriaView.onpointermove = e => {
    if (!eriaPointers.has(e.pointerId)) return;

    eriaPointers.set(e.pointerId,{x:e.clientX-W/2,y:e.clientY-H/2});

  function makeLandmark(mark) {

  }

  function drawLandmarks() {
    const current = P[selected];

    const mode = local ? "Локальная карта · ориентиры с пояснениями" : "Общий план · приблизьте карту";

  function bounds() {

    document.getElementById("cdesc").scrollTop = 0;
    const gal = document.getElementById("cgal"); gal.innerHTML = "";
    shots = [p.cover || p.img, ...(p.gallery || [])];
    shots.forEach((src, k) => { const im = document.createElement("img"); im.src = src; im.loading = "lazy"; im.alt = ""; im.onclick = () => openLb(k); gal.append(im); });
    card.classList.add("open"); hideHint();
    const mobile = W <= 600;
    const right = mobile ? W : W - card.offsetWidth - 24;
    const bottom = mobile ? H - card.offsetHeight - 12 : H;
    const top = 62;
    const mark = localLandmarks.get(p.id);
    const pad = p.size * (p.effect === "shield" ? 0.74 : 0.58);
    const minX = mark ? Math.min(p.x - pad, mark.x - mark.radius) : p.x - pad;
    const maxX = mark ? Math.max(p.x + pad, mark.x + mark.radius) : p.x + pad;
    const minY = mark ? Math.min(p.y - pad, mark.y - mark.radius * 1.3) : p.y - pad;
    const maxY = mark ? Math.max(p.y + pad + 40, mark.y + mark.radius) : p.y + pad + 40;
    const z = Math.min((right - 32) / (maxX - minX), Math.max(64, bottom - top - 24) / (maxY - minY), MAXZ);
    target = { x: (minX + maxX) / 2 + (W - right) / (2 * z),
      y: (minY + maxY) / 2 + (H - top - bottom) / (2 * z), z };
    history.replaceState(null, "", "#" + p.id);
  }
  let shots = [], lbk = 0;
  const lb = document.getElementById("lb"), lbi = document.getElementById("lbi");
  function openLb(k) { lbk = (k + shots.length) % shots.length; lbi.src = shots[lbk]; document.getElementById("lbc").textContent = (lbk + 1) + " / " + shots.length; lb.classList.add("open"); }
  cover.onclick = () => openLb(0);
  const closeLb = () => lb.classList.remove("open");
  document.getElementById("lbx").onclick = closeLb;
  document.getElementById("lbp").onclick = e => { e.stopPropagation(); openLb(lbk - 1); };
  document.getElementById("lbn").onclick = e => { e.stopPropagation(); openLb(lbk + 1); };
  lb.onclick = e => { if (e.target === lb) closeLb(); };
  document.getElementById("cclose").onclick = () => select(-1);
  document.getElementById("prev").onclick = () => select((selected - 1 + P.length) % P.length);
  document.getElementById("next").onclick = () => select((selected + 1) % P.length);
  document.getElementById("home").onclick = () => { select(-1); target = bounds(); };
  const zoomBy = (f, sx = W / 2, sy = H / 2) => {
    target = null;
    const [wx, wy] = toWorld(sx, sy);
    cam.z = Math.min(MAXZ, Math.max(Math.min(0.08, bounds().z), cam.z * f));
    cam.x = wx - (sx - W / 2) / cam.z; cam.y = wy - (sy - H / 2) / cam.z;
  };
  document.getElementById("zin").onclick = () => { const z = cam.z; target = { x: cam.x, y: cam.y, z: Math.min(MAXZ, z * 1.6) }; };
  document.getElementById("zout").onclick = () => { const z = cam.z; target = { x: cam.x, y: cam.y, z: Math.max(Math.min(0.08, bounds().z), z / 1.6) }; };

  // --- ввод: мышь, тач, щипок
  const ptrs = new Map();
  const reducedMotion = matchMedia("(prefers-reduced-motion: reduce)");
  reducedMotion.addEventListener("change", () => { needsDraw = true; });
  let moved = 0, pinch = null, wheelPause = 0;
  cv.addEventListener("pointerdown", e => {
    cv.setPointerCapture(e.pointerId); ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
    moved = 0; target = null; cv.classList.add("drag"); hideHint();
    if (ptrs.size === 2) { const [a, b] = [...ptrs.values()]; pinch = { d: Math.hypot(a.x - b.x, a.y - b.y), z: cam.z }; }
  });
  cv.addEventListener("pointermove", e => {
    if (!ptrs.has(e.pointerId)) {
      hovered = hit(e.clientX, e.clientY); cv.classList.toggle("hover", hovered >= 0); return;
    }
    const prev = ptrs.get(e.pointerId), cur = { x: e.clientX, y: e.clientY };
    ptrs.set(e.pointerId, cur);
    if (ptrs.size === 1) {
      const dx = cur.x - prev.x, dy = cur.y - prev.y; moved += Math.abs(dx) + Math.abs(dy);
      cam.x -= dx / cam.z; cam.y -= dy / cam.z;
    } else if (ptrs.size === 2 && pinch) {
      const [a, b] = [...ptrs.values()];
      const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
      const [wx, wy] = toWorld(mx, my);
      cam.z = Math.min(MAXZ, Math.max(Math.min(0.08, bounds().z), pinch.z * Math.hypot(a.x - b.x, a.y - b.y) / pinch.d));
      cam.x = wx - (mx - W / 2) / cam.z; cam.y = wy - (my - H / 2) / cam.z;
      // перенос центра щипка
      const pdx = (cur.x - prev.x) / 2, pdy = (cur.y - prev.y) / 2;
      cam.x -= pdx / cam.z; cam.y -= pdy / cam.z; moved += 100;
    }
  });
  const up = e => {
    if (!ptrs.has(e.pointerId)) return;
    ptrs.delete(e.pointerId); needsDraw = true;
    if (ptrs.size < 2) pinch = null;
    if (ptrs.size === 0) {
      cv.classList.remove("drag");
      if (moved < 6) { const i = hit(e.clientX, e.clientY); if (P[i]?.id === "w235") enterEria(); else if (i >= 0) select(i); else if (selected >= 0) select(-1); }
    }
  };
  cv.addEventListener("pointerup", up); cv.addEventListener("pointercancel", up);
  cv.addEventListener("wheel", e => {
    e.preventDefault();
    hideHint();
    clearTimeout(wheelPause);
    wheelPause = setTimeout(() => { wheelPause = 0; needsDraw = true; }, 140);
    zoomBy(Math.exp(-e.deltaY * 0.0015), e.clientX, e.clientY);
  }, { passive: false });
  addEventListener("keydown", e => {
    if (eriaScene.open) return;
    if (deepField && e.key === "Escape") { finishArrival(); return; }
    if (e.key === "Escape" && !landmarkNote.hidden) { dismissNote(true); return; }
    if (e.target === picker) return;
    if (lb.classList.contains("open")) {
      if (e.key === "Escape") closeLb();
      if (e.key === "ArrowRight") openLb(lbk + 1);
      if (e.key === "ArrowLeft") openLb(lbk - 1);
      return;
    }
    if (e.key === "Escape") select(-1);
    if (e.key === "ArrowRight" && selected >= 0) select((selected + 1) % P.length);
    if (e.key === "ArrowLeft" && selected >= 0) select((selected - 1 + P.length) % P.length);
  });
  addEventListener("resize", resize);
  function openLinkedWorld(initial = false) {
    const fragment = location.hash.slice(1);
    const legacy = fragment.startsWith("universe/");
    const id = legacy ? fragment.split("/")[2] : fragment;
    const index = P.findIndex(p => p.id === id);
    if (!legacy && index < 0) return false;
    if (deepField) finishArrival();
    select(index);
    if (index < 0) target = bounds();
    if (initial || reducedMotion.matches) {
      Object.assign(cam, target);
      target = null;
    }
    return true;
  }
  addEventListener("hashchange", () => openLinkedWorld());

  resize();
  Object.assign(cam, bounds());
  if (!openLinkedWorld(true) && !location.hash && !reducedMotion.matches) {
    deepField = makeDeepField();
    arrival.hidden = false;
    document.body.classList.add("arriving");
  } else setTimeout(hideHint, 7000);
  requestAnimationFrame(draw);
})();
</script>
</body>
