<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Ad mundos novos — галактика</title>
<style>
  :root { --fg:#e9e4ff; --dim:#9a93b8; --accent:#b9a6ff; --panel:rgba(14,10,28,.82); }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:#000; color:var(--fg); overflow:hidden;
    font-family: "Segoe UI", system-ui, -apple-system, Roboto, sans-serif; }
  canvas { position:fixed; inset:0; width:100%; height:100%; display:block; touch-action:none; cursor:grab; }
  canvas.drag { cursor:grabbing; }
  canvas.hover { cursor:pointer; }
  header { position:fixed; left:20px; top:16px; pointer-events:none; }
  header h1 { margin:0; font-size:20px; letter-spacing:.18em; text-transform:uppercase; font-weight:600; }
  header p { margin:4px 0 0; font-size:12px; color:var(--dim); letter-spacing:.08em; }
  .tools { position:fixed; right:16px; top:16px; display:flex; gap:8px; }
  .tools button { background:var(--panel); color:var(--fg); border:1px solid rgba(185,166,255,.25);
    border-radius:10px; width:40px; height:40px; font-size:18px; cursor:pointer; backdrop-filter:blur(8px); }
  .tools button:hover { border-color:var(--accent); }
  #card { position:fixed; right:20px; bottom:20px; width:380px; max-width:calc(100vw - 40px);
    max-height:calc(100vh - 100px); display:flex; flex-direction:column;
    background:var(--panel); border:1px solid rgba(185,166,255,.25); border-radius:16px; padding:18px 18px 16px;
    backdrop-filter:blur(14px); transform:translateY(20px); opacity:0; pointer-events:none;
    transition:opacity .25s, transform .25s; }
  #card.open { opacity:1; transform:none; pointer-events:auto; }
  #card h2 { margin:0 28px 2px 0; font-size:18px; }
  #card .author { color:var(--accent); font-size:13px; }
  #card .group { color:var(--dim); font-size:12px; margin-top:2px; }
  #card .group:empty { display:none; }
  #card .desc { margin:12px 0 0; font-size:14px; line-height:1.55; color:#cfc8ea; white-space:pre-line;
    overflow-y:auto; flex:1 1 auto; min-height:0; padding-right:6px; }
  #card .desc:empty { display:none; }
  #card .desc.rich { white-space:normal; }
  #card .desc.rich p { margin:0 0 .7em; }
  #card .desc.rich h4 { margin:1em 0 .4em; font-size:14px; color:var(--fg); text-decoration:none; }
  #card .desc.rich h4 u { text-decoration:none; }
  #card .desc.rich blockquote { margin:0 0 .8em; padding:.2em 0 .2em .8em; border-left:2px solid rgba(185,166,255,.35); color:#bdb5dc; }
  #card .desc.rich blockquote p { margin:0; }
  #card .desc.rich ul, #card .desc.rich ol { margin:0 0 .7em; padding-left:1.2em; }
  #card .desc.rich a { all:revert; color:var(--accent); }
  #card .desc.rich hr { border:0; border-top:1px solid rgba(185,166,255,.2); margin:1em 0; }
  #card .desc::-webkit-scrollbar { width:4px; } #card .desc::-webkit-scrollbar-thumb { background:rgba(185,166,255,.3); border-radius:2px; }
  #card .author a { color:inherit; text-decoration:none; flex:none; padding:0; border:0; background:none; border-radius:0; font-size:inherit; } #card .author a:hover { text-decoration:underline; }
  .gal { display:flex; gap:6px; overflow-x:auto; margin-top:12px; padding-bottom:4px; flex:none; }
  .gal img { height:64px; width:auto; border-radius:8px; cursor:zoom-in; opacity:.85; border:1px solid rgba(185,166,255,.2); flex:none; }
  .gal img:hover { opacity:1; border-color:var(--accent); }
  #lb { position:fixed; inset:0; background:rgba(2,1,8,.94); display:none; align-items:center; justify-content:center; z-index:10; }
  #lb.open { display:flex; }
  #lb img { max-width:94vw; max-height:88vh; border-radius:6px; box-shadow:0 0 60px rgba(185,166,255,.15); }
  #lb button { position:absolute; background:none; border:0; color:#e9e4ff; font-size:34px; cursor:pointer; padding:16px; }
  #lbx { top:6px; right:10px; } #lbp { left:6px; top:50%; transform:translateY(-50%); } #lbn { right:6px; top:50%; transform:translateY(-50%); }
  #lbc { position:absolute; bottom:14px; left:50%; transform:translateX(-50%); color:var(--dim); font-size:13px; }
  #card .row { display:flex; gap:8px; margin-top:14px; }
  #card a, #card button.nav { flex:1; text-align:center; text-decoration:none; color:var(--fg); font-size:13px;
    padding:9px 10px; border-radius:10px; border:1px solid rgba(185,166,255,.3); background:rgba(185,166,255,.08); cursor:pointer; }
  #card a:hover, #card button.nav:hover { border-color:var(--accent); }
  #card .close { position:absolute; right:10px; top:8px; background:none; border:0; color:var(--dim); font-size:22px; cursor:pointer; }
  #hint { position:fixed; left:50%; bottom:18px; transform:translateX(-50%); font-size:12px; color:var(--dim);
    pointer-events:none; transition:opacity 1s; }
  @media (max-width:600px) {
    #card { left:12px; right:12px; bottom:12px; width:auto; max-width:none; max-height:58vh; }
    header { left:14px; top:14px; max-width:calc(100vw - 170px); }
    header h1 { font-size:14px; letter-spacing:.12em; }
    header p { font-size:11px; }
    .tools { right:12px; top:12px; gap:6px; }
    .tools button { width:36px; height:36px; }
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<header><h1 id="t"></h1><p id="st"></p></header>
<div class="tools">
  <button id="zin" title="Приблизить">+</button>
  <button id="zout" title="Отдалить">−</button>
  <button id="home" title="Вся галактика">◎</button>
</div>
<div id="card">
  <button class="close" id="cclose">×</button>
  <h2 id="cname"></h2>
  <div class="author" id="cauthor"></div>
  <div class="group" id="cgroup"></div>
  <div class="desc" id="cdesc"></div>
  <div class="gal" id="cgal"></div>
  <div class="row">
    <button class="nav" id="prev" title="Предыдущая">←</button>
    <a id="clink" target="_blank" rel="noopener">Пост</a>
    <a id="cart" target="_blank" rel="noopener">Статья</a>
    <button class="nav" id="next" title="Следующая">→</button>
  </div>
</div>
<div id="lb"><img id="lbi" alt=""><button id="lbx">×</button><button id="lbp">‹</button><button id="lbn">›</button><div id="lbc"></div></div>
<div id="hint">Тяни, чтобы лететь · колесо или щипок — зум · нажми на планету</div>

<script src="planets.js"></script>
<script>
(() => {
  const G = window.GALAXY, P = G.planets;
  document.getElementById("t").textContent = G.title;
  document.getElementById("st").textContent = G.subtitle;

  const cv = document.getElementById("c"), ctx = cv.getContext("2d");
  let W = 0, H = 0, DPR = 1;
  const cam = { x: 0, y: 0, z: 0.5 };
  let target = null;           // куда летит камера
  let selected = -1, hovered = -1;
  const MINZ = 0.08, MAXZ = 3;

  // --- загрузка картинок
  P.forEach(p => { p.im = new Image(); p.im.src = p.img; p.im.onload = () => { p.ready = true; }; });

  // --- оформление окрестностей: свечение в цветах планеты + частицы по мотивам из описания
  const hexRgb = h => { const n = parseInt(h.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; };
  const mulberry = a => () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  const FX_COUNT = { bubbles: 18, crystals: 14, embers: 26, snow: 26, spores: 22, petals: 16, sparkles: 22, tendrils: 9, rings: 3, debris: 14, glitch: 16, hearts: 12 };
  P.forEach((p, i) => {
    const R = mulberry(i * 9973 + 17);
    p.pal = (p.palette && p.palette.length ? p.palette : ["#b9a6ff"]).map(hexRgb);
    p.fx = [];
    (p.motifs || ["sparkles"]).forEach((m, mi) => {
      const n = Math.round((FX_COUNT[m] || 18) * (mi ? 0.6 : 1));
      for (let k = 0; k < n; k++) p.fx.push({ m, k, n, a: R() * 6.283, r: 0.44 + R() * 0.5, sp: 0.6 + R() * 0.8,
        ph: m === "rings" ? k / n : R(), s: 0.6 + R() * 0.8, c: p.pal[(k + mi) % p.pal.length], rot: R() * 6.283 });
    });
  });
  const rgba = (c, a) => `rgba(${c[0]},${c[1]},${c[2]},${a})`;

  function drawAura(p, i, sx, sy, S, t) {
    ctx.globalCompositeOperation = "lighter";
    p.pal.forEach((c, j) => {
      const ang = j * 2.1 + i + t * 0.00004 * (j % 2 ? 1 : -1);
      const cx = sx + Math.cos(ang) * S * 0.16, cy = sy + Math.sin(ang) * S * 0.12;
      const r = S * (0.78 + 0.06 * Math.sin(t / 3000 + j + i));
      const g = ctx.createRadialGradient(cx, cy, S * 0.2, cx, cy, r);
      g.addColorStop(0, rgba(c, 0.11)); g.addColorStop(0.55, rgba(c, 0.05)); g.addColorStop(1, rgba(c, 0));
      ctx.fillStyle = g; ctx.fillRect(cx - r, cy - r, r * 2, r * 2);
    });
  }

  function drawFx(p, sx, sy, S, t, fxA) {
    const T = t / 1000, U = S / 500;               // U — масштаб «пикселя» относительно планеты 500px
    for (const f of p.fx) {
      const u = (T * 0.08 * f.sp + f.ph) % 1;    // фаза цикла 0..1
      let x, y, al = 1, shape = f.m;
      switch (f.m) {
        case "bubbles": case "hearts":
          x = Math.cos(f.a) * f.r + Math.sin(T * 0.8 + f.ph * 9) * 0.03; y = 0.55 - u * 1.15; al = Math.sin(u * Math.PI); break;
        case "embers":
          x = Math.cos(f.a) * f.r + Math.sin(T * 1.6 + f.ph * 12) * 0.035; y = 0.35 + Math.sin(f.a) * 0.15 - u * 0.95;
          al = Math.sin(u * Math.PI) * (0.6 + 0.4 * Math.sin(T * 9 + f.ph * 20)); break;
        case "snow":
          x = Math.cos(f.a) * f.r + Math.sin(T * 0.6 + f.ph * 9) * 0.05; y = -0.6 + u * 1.2; al = Math.sin(u * Math.PI) * 0.85; break;
        case "spores": {
          const b = f.a + T * 0.05 * f.sp;
          x = Math.cos(b) * f.r + Math.sin(T * 0.3 + f.ph * 7) * 0.05; y = Math.sin(b) * f.r * 0.8 + Math.cos(T * 0.25 + f.ph * 5) * 0.05;
          al = 0.5 + 0.5 * Math.sin(T * 1.3 + f.ph * 11); break; }
        case "crystals": case "debris": {
          const b = f.a + T * 0.06 * f.sp * (f.k % 2 ? 1 : 0.8);
          x = Math.cos(b) * (f.r + 0.08); y = Math.sin(b) * (f.r + 0.08) * 0.42 + 0.04; break; }
        case "petals": {
          const b = f.a + u * 2.2, rr = f.r + u * 0.3;
          x = Math.cos(b) * rr; y = Math.sin(b) * rr * 0.75; al = Math.sin(u * Math.PI); break; }
        case "sparkles":
          x = Math.cos(f.a) * (f.r + 0.05); y = Math.sin(f.a) * (f.r + 0.05) * 0.85;
          al = Math.pow(Math.max(0, Math.sin(T * f.sp * 1.6 + f.ph * 6.283)), 3); break;
        case "glitch": {
          const slot = Math.floor(T * f.sp * 1.5 + f.ph * 10), h = mulberry(slot * 131 + f.k * 7 + 1);
          const b = h() * 6.283, rr = 0.45 + h() * 0.45;
          x = Math.cos(b) * rr; y = Math.sin(b) * rr * 0.8; al = h() > 0.45 ? 0.9 : 0; f.g = h(); break; }
        case "tendrils": x = Math.cos(f.a) * 0.42; y = Math.sin(f.a) * 0.42; al = 0.5; break;
        case "rings": x = 0; y = 0; al = (1 - u) * 0.45; break;
      }
      if (al <= 0.01) continue;
      if (f.m !== "rings" && f.m !== "tendrils") {          // не залезаем на сам арт
        const d = Math.hypot(x, y);
        if (d < 0.36) continue;
        al *= Math.min(1, (d - 0.36) / 0.1);
      }
      const px = sx + x * S, py = sy + y * S, sz = f.s * U;
      if (px < -50 || px > W + 50 || py < -50 || py > H + 50) continue;
      const A = al * fxA;
      ctx.globalCompositeOperation = "lighter";
      ctx.strokeStyle = ctx.fillStyle = rgba(f.c, A);
      ctx.lineWidth = Math.max(0.6, 1.4 * U);
      switch (shape) {
        case "bubbles":
          ctx.beginPath(); ctx.arc(px, py, Math.max(1.5, 9 * sz), 0, 6.283); ctx.globalAlpha = 0.7; ctx.stroke();
          ctx.globalAlpha = 1; ctx.fillStyle = rgba([255, 255, 255], A * 0.6);
          ctx.beginPath(); ctx.arc(px - 3 * sz, py - 3 * sz, Math.max(0.6, 2 * sz), 0, 6.283); ctx.fill(); break;
        case "embers": case "spores": {
          const r = Math.max(0.8, (f.m === "embers" ? 2.6 : 3.4) * sz);
          ctx.fillStyle = rgba(f.c, A * 0.25); ctx.beginPath(); ctx.arc(px, py, r * 3, 0, 6.283); ctx.fill();
          ctx.fillStyle = rgba(f.c, A); ctx.beginPath(); ctx.arc(px, py, r, 0, 6.283); ctx.fill(); break; }
        case "snow": {
          const r = Math.max(1, 5 * sz);
          if (r < 2.5) { ctx.beginPath(); ctx.arc(px, py, r * 0.6, 0, 6.283); ctx.fill(); break; }
          ctx.strokeStyle = rgba([230, 240, 255], A); ctx.beginPath();
          for (let q = 0; q < 3; q++) { const b = f.rot + T * 0.3 + q * 1.047; ctx.moveTo(px - Math.cos(b) * r, py - Math.sin(b) * r); ctx.lineTo(px + Math.cos(b) * r, py + Math.sin(b) * r); }
          ctx.stroke(); break; }
        case "crystals": case "debris": {
          const r = Math.max(1.5, (f.m === "crystals" ? 9 : 6) * sz), b = f.rot + T * 0.4 * (f.k % 2 ? 1 : -1);
          ctx.save(); ctx.translate(px, py); ctx.rotate(b); ctx.beginPath();
          if (f.m === "crystals") { ctx.moveTo(0, -r); ctx.lineTo(r * 0.45, 0); ctx.lineTo(0, r); ctx.lineTo(-r * 0.45, 0); }
          else { ctx.moveTo(-r, -r * 0.4); ctx.lineTo(r * 0.3, -r * 0.8); ctx.lineTo(r, r * 0.2); ctx.lineTo(-r * 0.2, r * 0.7); }
          ctx.closePath();
          if (f.m === "debris") { ctx.globalCompositeOperation = "source-over"; ctx.fillStyle = `rgba(${f.c.map(v => v * 0.25 | 0)},${A * 0.9})`; }
          else ctx.fillStyle = rgba(f.c, A * 0.25);
          ctx.fill(); ctx.strokeStyle = rgba(f.c, A * 0.9); ctx.stroke(); ctx.restore(); break; }
        case "petals": {
          const r = Math.max(1.5, 7 * sz);
          ctx.save(); ctx.translate(px, py); ctx.rotate(f.rot + T * 0.8); ctx.beginPath(); ctx.ellipse(0, 0, r, r * 0.42, 0, 0, 6.283);
          ctx.fillStyle = rgba(f.c, A * 0.7); ctx.fill(); ctx.restore(); break; }
        case "sparkles": {
          const r = Math.max(2, 8 * sz);
          ctx.beginPath(); ctx.moveTo(px - r, py); ctx.lineTo(px + r, py); ctx.moveTo(px, py - r); ctx.lineTo(px, py + r); ctx.stroke();
          ctx.beginPath(); ctx.arc(px, py, Math.max(0.7, 1.4 * sz), 0, 6.283); ctx.fill(); break; }
        case "hearts": {
          const r = Math.max(1.5, 5 * sz);
          ctx.beginPath(); ctx.moveTo(px, py + r);
          ctx.bezierCurveTo(px - r * 1.6, py - r * 0.2, px - r * 0.6, py - r * 1.4, px, py - r * 0.5);
          ctx.bezierCurveTo(px + r * 0.6, py - r * 1.4, px + r * 1.6, py - r * 0.2, px, py + r);
          ctx.fillStyle = rgba(f.c, A * 0.8); ctx.fill(); break; }
        case "glitch": {
          const r = Math.max(2, 7 * sz);
          if (f.g > 0.5) { ctx.fillStyle = rgba(f.c, A * 0.8); ctx.fillRect(px, py, r * (1 + f.g * 2), r * 0.5); }
          else { ctx.font = `${Math.max(7, 12 * U) | 0}px monospace`; ctx.fillText(f.g > 0.25 ? "1" : "0", px, py); }
          break; }
        case "tendrils": {
          const len = 0.3 + 0.12 * f.s, wav = Math.sin(T * 0.7 * f.sp + f.ph * 6.283) * 0.12;
          const nx = Math.cos(f.a), ny = Math.sin(f.a), ex = sx + nx * (0.42 + len) * S, ey = sy + ny * (0.42 + len) * S;
          const cx = sx + (nx * (0.42 + len / 2) - ny * wav) * S, cy = sy + (ny * (0.42 + len / 2) + nx * wav) * S;
          const g = ctx.createLinearGradient(px, py, ex, ey); g.addColorStop(0, rgba(f.c, A * 0.6)); g.addColorStop(1, rgba(f.c, 0));
          ctx.strokeStyle = g; ctx.lineWidth = Math.max(0.8, 2.2 * U); ctx.beginPath(); ctx.moveTo(px, py); ctx.quadraticCurveTo(cx, cy, ex, ey); ctx.stroke(); break; }
        case "rings": {
          const rr = (0.46 + u * 0.55) * S;
          ctx.lineWidth = Math.max(0.8, 2 * U); ctx.beginPath(); ctx.ellipse(sx, sy, rr, rr * 0.92, 0, 0, 6.283); ctx.stroke(); break; }
      }
    }
    ctx.globalAlpha = 1; ctx.globalCompositeOperation = "source-over";
  }

  // --- детерминированный генератор случайных чисел
  let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;

  // --- звёзды: 3 слоя параллакса, в экранных координатах с зацикливанием
  const layers = [0.08, 0.2, 0.45].map((par, i) => ({
    par, stars: Array.from({ length: 260 - i * 70 }, () => ({
      x: rnd(), y: rnd(), r: (0.4 + rnd() * (0.6 + i * 0.5)), a: 0.3 + rnd() * 0.7, tw: rnd() * 6.28,
      hue: rnd() < 0.15 ? 260 : rnd() < 0.1 ? 30 : 0
    }))
  }));
  const TILE = 1400;

  // --- туманности и рукава в мировых координатах
  const nebulae = [];
  const arms = G.arms || 3, R = Math.max(900, G.radius || 1500);
  for (let a = 0; a < arms; a++) for (let k = 0; k < 14; k++) {
    const t = k / 13, ang = a * 2 * Math.PI / arms + t * 3.2, rad = 120 + t * R;
    nebulae.push({ x: Math.cos(ang) * rad + (rnd() - .5) * 260, y: Math.sin(ang) * rad * 0.75 + (rnd() - .5) * 220,
      r: 260 + rnd() * 420, hue: [265, 220, 300, 195][(a + k) % 4], a: 0.05 + rnd() * 0.07 });
  }
  const dust = Array.from({ length: Math.min(3000, Math.round(900 * R / 1500)) }, () => {
    const a = Math.floor(rnd() * arms), t = Math.pow(rnd(), 0.8), ang = a * 2 * Math.PI / arms + t * 3.2 + (rnd() - .5) * 0.5;
    const rad = 60 + t * R * 1.1;
    return { x: Math.cos(ang) * rad + (rnd() - .5) * 180, y: Math.sin(ang) * rad * 0.75 + (rnd() - .5) * 160, r: 0.6 + rnd() * 1.8, a: 0.2 + rnd() * 0.6 };
  });

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    cv.width = W * DPR; cv.height = H * DPR;
  }
  const toScreen = (x, y) => [(x - cam.x) * cam.z + W / 2, (y - cam.y) * cam.z + H / 2];
  const toWorld = (sx, sy) => [(sx - W / 2) / cam.z + cam.x, (sy - H / 2) / cam.z + cam.y];

  function bounds() {
    let a = Infinity, b = Infinity, c = -Infinity, d = -Infinity;
    P.forEach(p => { a = Math.min(a, p.x - p.size / 2); b = Math.min(b, p.y - p.size / 2); c = Math.max(c, p.x + p.size / 2); d = Math.max(d, p.y + p.size / 2); });
    return { x: (a + c) / 2, y: (b + d) / 2, z: Math.min(W / (c - a + 200), H / (d - b + 200)) };
  }

  // --- отрисовка
  function draw(time) {
    if (target) {
      const k = 0.09;
      cam.x += (target.x - cam.x) * k; cam.y += (target.y - cam.y) * k;
      cam.z *= Math.pow(target.z / cam.z, k);
      if (Math.abs(target.x - cam.x) < 0.5 && Math.abs(target.y - cam.y) < 0.5 && Math.abs(target.z / cam.z - 1) < 0.002) target = null;
    }
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.globalCompositeOperation = "source-over";
    ctx.fillStyle = "#020108"; ctx.fillRect(0, 0, W, H);

    // фоновые звёзды
    for (const L of layers) {
      const ox = cam.x * cam.z * L.par, oy = cam.y * cam.z * L.par;
      for (const s of L.stars) {
        let sx = (s.x * TILE - ox) % TILE; if (sx < 0) sx += TILE;
        let sy = (s.y * TILE - oy) % TILE; if (sy < 0) sy += TILE;
        const al = s.a * (0.7 + 0.3 * Math.sin(time / 900 + s.tw));
        ctx.fillStyle = s.hue ? `hsla(${s.hue},80%,80%,${al})` : `rgba(255,255,255,${al})`;
        for (let tx = sx; tx < W; tx += TILE) for (let ty = sy; ty < H; ty += TILE) {
          ctx.beginPath(); ctx.arc(tx, ty, s.r, 0, 6.283); ctx.fill();
        }
      }
    }

    // ядро, туманности, пыль рукавов
    ctx.globalCompositeOperation = "lighter";
    const [cx, cy] = toScreen(0, 0);
    let g = ctx.createRadialGradient(cx, cy, 0, cx, cy, Math.max(700, R * 0.45) * cam.z);
    g.addColorStop(0, "rgba(255,225,200,.35)"); g.addColorStop(.25, "rgba(190,140,255,.12)"); g.addColorStop(1, "rgba(0,0,0,0)");
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    for (const n of nebulae) {
      const [sx, sy] = toScreen(n.x, n.y), r = n.r * cam.z;
      if (sx + r < 0 || sx - r > W || sy + r < 0 || sy - r > H) continue;
      g = ctx.createRadialGradient(sx, sy, 0, sx, sy, r);
      g.addColorStop(0, `hsla(${n.hue},70%,55%,${n.a})`); g.addColorStop(1, "hsla(0,0%,0%,0)");
      ctx.fillStyle = g; ctx.fillRect(sx - r, sy - r, r * 2, r * 2);
    }
    ctx.fillStyle = "rgba(220,210,255,.5)";
    for (const d of dust) {
      const [sx, sy] = toScreen(d.x, d.y);
      if (sx < -5 || sx > W + 5 || sy < -5 || sy > H + 5) continue;
      ctx.globalAlpha = d.a; ctx.beginPath(); ctx.arc(sx, sy, Math.max(0.5, d.r * Math.min(1, cam.z * 1.5)), 0, 6.283); ctx.fill();
    }
    ctx.globalAlpha = 1;

    // планеты: режим screen делает чёрный фон картинки прозрачным
    P.forEach((p, i) => {
      if (!p.ready) return;
      const bob = Math.sin(time / 2400 + i * 1.7) * 6;
      const [sx, sy] = toScreen(p.x, p.y + bob);
      const w = p.size * cam.z, h = w * p.im.naturalHeight / p.im.naturalWidth;
      if (sx + w * 1.3 < 0 || sx - w * 1.3 > W || sy + h * 1.3 < 0 || sy - h * 1.3 > H) return;
      if (i === hovered || i === selected) {
        ctx.globalCompositeOperation = "lighter";
        const r = Math.max(w, h) * 0.55;
        g = ctx.createRadialGradient(sx, sy, r * 0.3, sx, sy, r);
        g.addColorStop(0, `rgba(185,166,255,${i === selected ? .22 : .12})`); g.addColorStop(1, "rgba(0,0,0,0)");
        ctx.fillStyle = g; ctx.fillRect(sx - r, sy - r, r * 2, r * 2);
      }
      const S = p.size * cam.z;
      const fxA = Math.min(1, Math.max(0, (S - 50) / 110));   // мелкие (далёкие) планеты без частиц
      drawAura(p, i, sx, sy, S, time);
      ctx.globalCompositeOperation = "screen";
      ctx.drawImage(p.im, sx - w / 2, sy - h / 2, w, h);
      if (fxA > 0) drawFx(p, sx, sy, S, time, fxA);
      // подпись при достаточном зуме
      const act = i === hovered || i === selected;
      const la = act ? 1 : Math.min(1, Math.max(0, (cam.z - 0.2) / 0.12));
      if (la > 0) {
        ctx.globalCompositeOperation = "source-over";
        ctx.globalAlpha = la * (act ? 1 : 0.8);
        ctx.textAlign = "center"; ctx.shadowColor = "#000"; ctx.shadowBlur = 6;
        ctx.fillStyle = "#e9e4ff"; ctx.font = "600 13px 'Segoe UI', system-ui, sans-serif";
        const maxw = act ? 1e9 : Math.max(90, w * 0.9);
        let name = p.name;
        if (ctx.measureText(name).width > maxw) { while (name.length > 4 && ctx.measureText(name + "…").width > maxw) name = name.slice(0, -1); name = name.trimEnd() + "…"; }
        const ly = sy + h / 2 * 0.94;
        ctx.fillText(name, sx, ly);
        if (act || cam.z > 0.5) { ctx.fillStyle = "#9a93b8"; ctx.font = "12px 'Segoe UI', system-ui, sans-serif"; ctx.fillText(p.author, sx, ly + 16); }
        ctx.shadowBlur = 0; ctx.globalAlpha = 1;
      }
    });
    requestAnimationFrame(draw);
  }

  function hit(sx, sy) {
    const [wx, wy] = toWorld(sx, sy);
    let best = -1, bd = Infinity;
    P.forEach((p, i) => {
      const d = Math.hypot(wx - p.x, wy - p.y);
      if (d < p.size * 0.42 && d < bd) { bd = d; best = i; }
    });
    return best;
  }

  // --- карточка
  const card = document.getElementById("card");
  const hint = document.getElementById("hint");
  const hideHint = () => { hint.style.opacity = 0; };
  function select(i) {
    selected = i;
    if (i < 0) { card.classList.remove("open"); history.replaceState(null, "", location.pathname); return; }
    const p = P[i];
    document.getElementById("cname").textContent = p.name;
    const au = document.getElementById("cauthor"); au.textContent = "";
    if (/^@\w+$/.test(p.author)) { const a = document.createElement("a"); a.href = "https://t.me/" + p.author.slice(1); a.target = "_blank"; a.rel = "noopener"; a.textContent = p.author; au.append(a); }
    else au.textContent = p.author;
    const cd = document.getElementById("cdesc");
    cd.classList.toggle("rich", !!p.descriptionHtml);
    if (p.descriptionHtml) cd.innerHTML = p.descriptionHtml;   // очищено при сборке (tools/fetch_articles.py)
    else cd.textContent = p.description || "";
    document.getElementById("cgroup").textContent = (p.featured ? "★ " : "") + (p.group || "");
    const l = document.getElementById("clink");
    l.style.display = p.link ? "" : "none"; l.href = p.link || "#";
    const ar = document.getElementById("cart");
    ar.style.display = p.article ? "" : "none"; ar.href = p.article || "#";
    document.getElementById("cdesc").scrollTop = 0;
    const gal = document.getElementById("cgal"); gal.innerHTML = "";
    shots = [p.cover || p.img, ...(p.gallery || [])];
    shots.forEach((src, k) => { const im = document.createElement("img"); im.src = src; im.loading = "lazy"; im.alt = ""; im.onclick = () => openLb(k); gal.append(im); });
    card.classList.add("open"); hideHint();
    const mobile = W < 600;
    // планета встаёт в свободную от карточки часть экрана
    const cardH = mobile ? card.offsetHeight + 12 : 0;
    const freeH = H - cardH - 60;
    const z = mobile ? Math.min(W / (p.size * 1.05), freeH / (p.size * 0.95), MAXZ)
                     : Math.min(W / (p.size * 1.6), H / (p.size * 1.3), MAXZ);
    target = { x: p.x + (mobile ? 0 : 200 / z), y: p.y + (mobile ? (H / 2 - (60 + freeH / 2)) / z : 0), z };
    history.replaceState(null, "", "#" + p.id);
  }
  let shots = [], lbk = 0;
  const lb = document.getElementById("lb"), lbi = document.getElementById("lbi");
  function openLb(k) { lbk = (k + shots.length) % shots.length; lbi.src = shots[lbk]; document.getElementById("lbc").textContent = (lbk + 1) + " / " + shots.length; lb.classList.add("open"); }
  const closeLb = () => lb.classList.remove("open");
  document.getElementById("lbx").onclick = closeLb;
  document.getElementById("lbp").onclick = e => { e.stopPropagation(); openLb(lbk - 1); };
  document.getElementById("lbn").onclick = e => { e.stopPropagation(); openLb(lbk + 1); };
  lb.onclick = e => { if (e.target === lb) closeLb(); };
  document.getElementById("cclose").onclick = () => select(-1);
  document.getElementById("prev").onclick = () => select((selected - 1 + P.length) % P.length);
  document.getElementById("next").onclick = () => select((selected + 1) % P.length);
  document.getElementById("home").onclick = () => { select(-1); target = bounds(); };
  const zoomBy = (f, sx = W / 2, sy = H / 2) => {
    target = null;
    const [wx, wy] = toWorld(sx, sy);
    cam.z = Math.min(MAXZ, Math.max(MINZ, cam.z * f));
    cam.x = wx - (sx - W / 2) / cam.z; cam.y = wy - (sy - H / 2) / cam.z;
  };
  document.getElementById("zin").onclick = () => { const z = cam.z; target = { x: cam.x, y: cam.y, z: Math.min(MAXZ, z * 1.6) }; };
  document.getElementById("zout").onclick = () => { const z = cam.z; target = { x: cam.x, y: cam.y, z: Math.max(MINZ, z / 1.6) }; };

  // --- ввод: мышь, тач, щипок
  const ptrs = new Map(); let moved = 0, pinch = null;
  cv.addEventListener("pointerdown", e => {
    cv.setPointerCapture(e.pointerId); ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
    moved = 0; target = null; cv.classList.add("drag"); hideHint();
    if (ptrs.size === 2) { const [a, b] = [...ptrs.values()]; pinch = { d: Math.hypot(a.x - b.x, a.y - b.y), z: cam.z }; }
  });
  cv.addEventListener("pointermove", e => {
    if (!ptrs.has(e.pointerId)) {
      hovered = hit(e.clientX, e.clientY); cv.classList.toggle("hover", hovered >= 0); return;
    }
    const prev = ptrs.get(e.pointerId), cur = { x: e.clientX, y: e.clientY };
    ptrs.set(e.pointerId, cur);
    if (ptrs.size === 1) {
      const dx = cur.x - prev.x, dy = cur.y - prev.y; moved += Math.abs(dx) + Math.abs(dy);
      cam.x -= dx / cam.z; cam.y -= dy / cam.z;
    } else if (ptrs.size === 2 && pinch) {
      const [a, b] = [...ptrs.values()];
      const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
      const [wx, wy] = toWorld(mx, my);
      cam.z = Math.min(MAXZ, Math.max(MINZ, pinch.z * Math.hypot(a.x - b.x, a.y - b.y) / pinch.d));
      cam.x = wx - (mx - W / 2) / cam.z; cam.y = wy - (my - H / 2) / cam.z;
      // перенос центра щипка
      const pdx = (cur.x - prev.x) / 2, pdy = (cur.y - prev.y) / 2;
      cam.x -= pdx / cam.z; cam.y -= pdy / cam.z; moved += 100;
    }
  });
  const up = e => {
    if (!ptrs.has(e.pointerId)) return;
    ptrs.delete(e.pointerId); if (ptrs.size < 2) pinch = null;
    if (ptrs.size === 0) {
      cv.classList.remove("drag");
      if (moved < 6) { const i = hit(e.clientX, e.clientY); if (i >= 0) select(i); else if (selected >= 0) select(-1); }
    }
  };
  cv.addEventListener("pointerup", up); cv.addEventListener("pointercancel", up);
  cv.addEventListener("wheel", e => { e.preventDefault(); hideHint(); zoomBy(Math.exp(-e.deltaY * 0.0015), e.clientX, e.clientY); }, { passive: false });
  addEventListener("keydown", e => {
    if (lb.classList.contains("open")) {
      if (e.key === "Escape") closeLb();
      if (e.key === "ArrowRight") openLb(lbk + 1);
      if (e.key === "ArrowLeft") openLb(lbk - 1);
      return;
    }
    if (e.key === "Escape") select(-1);
    if (e.key === "ArrowRight" && selected >= 0) select((selected + 1) % P.length);
    if (e.key === "ArrowLeft" && selected >= 0) select((selected - 1 + P.length) % P.length);
  });
  addEventListener("resize", resize);
  addEventListener("hashchange", () => { const i = P.findIndex(p => p.id === location.hash.slice(1)); if (i >= 0 && i !== selected) select(i); });

  resize();
  Object.assign(cam, bounds()); cam.z *= 0.35; // старт издалека — и прилёт к галактике
  target = bounds();
  const startId = location.hash.slice(1), si = P.findIndex(p => p.id === startId);
  if (si >= 0) setTimeout(() => select(si), 400);
  setTimeout(hideHint, 7000);
  requestAnimationFrame(draw);
})();
</script>
</body>
</html>
